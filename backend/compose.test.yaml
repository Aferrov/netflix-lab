services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  tests:
    image: node:20-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      npm_config_cache: /tmp/npm-cache
    depends_on:
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npm ci && npm run check && npm test"]
