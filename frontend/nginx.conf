server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # Proxy hacia el Service "backend". Se usa resolver + variable para que nginx
  # arranque aunque el backend aun no exista y re-resuelva el DNS del cluster.
  # nginx habla HTTP/1.0 con el upstream (sin keep-alive): cada peticion abre una
  # conexion nueva y kube-proxy la reparte entre los pods.
  location /api/ {
    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
    set $backend http://backend.netflix-lab.svc.cluster.local:8080;
    proxy_pass $backend;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
}
