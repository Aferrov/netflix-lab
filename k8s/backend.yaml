# Permisos para que el backend pueda leer (y borrar) pods y leer el HPA de SU namespace.
# Es solo para el laboratorio: en produccion no expongas esto a un dashboard publico.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: netflix-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend
  namespace: netflix-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend
  namespace: netflix-lab
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: netflix-lab
roleRef:
  kind: Role
  name: backend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: netflix-lab
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # actualiza sin perder capacidad
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:                        # reparte los pods entre nodos
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: backend }
      containers:
        - name: backend
          image: netflix-lab/backend:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: REDIS_HOST, value: redis }
          resources:
            requests: { cpu: 100m, memory: 64Mi }       # el HPA calcula el % sobre este valor
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:                               # ¿recibe trafico?
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:                                # ¿sigue vivo? si no, se reinicia
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netflix-lab
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: netflix-lab
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60    # por defecto son 300 s; 60 s para verlo en una demo
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: netflix-lab
spec:
  minAvailable: 2                       # un "kubectl drain" nunca deja menos de 2 pods
  selector:
    matchLabels: { app: backend }
