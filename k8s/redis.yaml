apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: netflix-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: netflix-lab
spec:
  replicas: 1
  strategy:
    type: Recreate          # el volumen es ReadWriteOnce: no puede haber dos pods a la vez
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]     # persiste el contador en disco
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: netflix-lab
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
